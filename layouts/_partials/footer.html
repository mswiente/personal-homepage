<footer class="site-footer">
  <div class="site-footer__inner">
    <span>© {{ now.Year }} {{ site.Copyright }}</span>
    <nav aria-label="Footer">
      {{- range site.Menus.footer }}
      <a href="{{ .URL }}">{{ .Name }}</a>
      {{- end }}
      {{- with site.Home.OutputFormats.Get "rss" }}
      <a href="{{ .RelPermalink }}">RSS</a>
      {{- end }}
    </nav>
  </div>
</footer>
