{{ define "main" }}
<header class="page-header">
  <h1>{{ .Title }}</h1>
  <form class="search" role="search" onsubmit="return false">
    <label class="visually-hidden" for="search-input">Search posts</label>
    <input id="search-input" type="search" placeholder="Search posts…" autocomplete="off" autofocus>
  </form>
  <p class="search__status" id="search-status" aria-live="polite"></p>
</header>
<div class="card-grid" id="search-results"></div>
{{- $js := resources.Get "js/search.js" | js.Build (dict "minify" true) | fingerprint }}
<script src="{{ $js.RelPermalink }}" integrity="{{ $js.Data.Integrity }}" data-index="{{ (site.Home.OutputFormats.Get "json").RelPermalink }}" defer></script>
{{ end }}
